# c-backup pipeline.
#
# Stages short-circuit: nothing is built if the tests fail, and nothing is
# deployed if the build fails. Coverage is a ratchet rather than a fixed
# target, because a gate set to an aspiration gets overridden until it means
# nothing, while one set to the current floor catches real regressions.

stages:
  - test
  - analyze
  - coverage
  - build
  - deploy

variables:
  CUTILS_DIR: /tmp/c-utils
  DEBIAN_FRONTEND: noninteractive
  # The Makefile defaults to the dev machine's znver3. Runners are not
  # guaranteed to be Zen 3, and a binary built for one CPU and run on another
  # dies on an illegal instruction, so CI builds to the portable floor.
  MARCH: x86-64-v2
  MTUNE: generic

.debian_deps: &debian_deps
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends
      build-essential git pkg-config ca-certificates
      libssl-dev liblz4-dev libacl1-dev libsqlite3-dev
      libmicrohttpd-dev libcurl4-openssl-dev libcmocka-dev
      sqlite3 curl gcovr cppcheck

# c-utils is pinned by the cutils_version file rather than tracking its
# master, so a change over there cannot break this build without someone
# choosing to move the pin.
.fetch_cutils: &fetch_cutils
  - git clone -q https://git.airies.net/vifair22/c-utils.git "$CUTILS_DIR"
  - git -C "$CUTILS_DIR" checkout -q "$(tr -d '[:space:]' < cutils_version)"
  - make -s -C "$CUTILS_DIR"

test:
  stage: test
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    # For the loopback fallback in tests/ci-sparse-fs.sh.
    - apt-get install -y -qq --no-install-recommends e2fsprogs
    - *fetch_cutils
  script:
    - make
    # Find somewhere the sparse fixtures can have real holes. Sourced, not
    # run: it exports the directory the suites read. Never fails the job -
    # if nothing here supports holes the suites skip, exactly as before.
    - . tests/ci-sparse-fs.sh
    # Unit suites, then the two shell suites. The shell ones drive a real
    # daemon over HTTP and the CLI over its socket, which is the only way to
    # cover the routes, the auth middleware and the job manager.
    - make test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/bins/

analyze:
  stage: analyze
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    - *fetch_cutils
  script:
    # 64 KiB per-function stack limit, gcc -fanalyzer, cppcheck. Worker
    # threads get 2-8 MiB stacks, so a function that quietly grows past the
    # limit is a crash waiting for a deep enough tree.
    - make analyze

# Fuzzing, on a budget a pipeline can afford.
#
# Two things happen here. The replay is the gate: it runs every input a
# fuzzer ever found interesting - including the reproducers for the three
# bugs that were found this way - and takes seconds. The short search is the
# opportunistic half: sixty seconds per target will not exhaust anything, but
# it is sixty seconds of a genuinely different test strategy on every push,
# and the corpus it grows comes back as an artifact to be committed.
#
# clang, because libFuzzer is an LLVM component. The strict-flag guarantees
# still come from the ordinary gcc build in the test stage; this exists to
# run the parsers against bytes nobody intended.
fuzz:
  stage: analyze
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    # clang alone is the driver with an empty resource directory: Debian
    # ships the sanitizer runtimes separately, so -fsanitize=fuzzer,address
    # fails at link with "cannot find libclang_rt.asan.a". Unversioned so
    # this does not pin the job to whichever clang trixie ships today.
    - apt-get install -y -qq --no-install-recommends clang libclang-rt-dev e2fsprogs
    - *fetch_cutils
  script:
    # Without this fuzz_sparse_write returns at its first line, and spends
    # its whole budget doing so: 23 million no-op executions in the run that
    # measured it, against 63 a second when it has somewhere to work.
    - . tests/ci-sparse-fs.sh
    # The gate. Any crash, timeout or sanitizer report on a known input fails
    # the pipeline.
    - make fuzz-regress
    # The search. A crash here fails the job too.
    - make fuzz-run FUZZ_TIME=60
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/fuzz/corpus/
      # Crash reproducers libFuzzer writes beside the binary.
      - crash-*
      - timeout-*
      - oom-*

coverage:
  stage: coverage
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    - *fetch_cutils
  script:
    - make coverage
  coverage: '/^lines:\s*(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/coverage/coverage.html

build:image:
  stage: build
  image: docker:latest
  tags: [docker, unraid]
  services:
    - docker:dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # An image that builds but dies on startup is the failure this catches:
    # run it, wait, and confirm it is still up before pushing.
    - docker run -d --name smoke "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - docker ps --filter name=smoke --filter status=running | grep -q smoke
    - docker logs smoke
    - docker rm -f smoke
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - master

# Deploy fans out to one child job per target so a host can be added or
# removed by editing a CI variable rather than this file. With no targets set
# the generator would emit a child pipeline containing no jobs, which GitLab
# rejects, so the whole stage sits out until someone configures a target. A
# red pipeline because nobody has picked a deploy host yet is noise.
#
# The rule is a bare variable, not a `!= ""` comparison: an undefined variable
# compares as null, and null != "" is true, so the comparison form runs the
# job in exactly the case it was written to prevent. A bare variable matches
# only when it is both defined and non-empty.
generate_deploy_child_pipeline:
  stage: deploy
  image: debian:trixie
  tags: [docker]
  script:
    - |
      : > deploy-child.yml
      echo "stages: [deploy]" >> deploy-child.yml
      i=0
      # Belt and braces behind the rule above. A child pipeline with no jobs
      # fails downstream as "unknown_failure", which says nothing about the
      # cause; failing here names it.
      if [ -z "$(printf '%s' "$CBACKUP_DEPLOY_TARGETS" | tr -d '[:space:]')" ]; then
        echo "CBACKUP_DEPLOY_TARGETS is empty: nothing to deploy to" >&2
        exit 1
      fi
      printf '%s\n' "$CBACKUP_DEPLOY_TARGETS" | while IFS='|' read -r host network ip; do
        [ -z "$host" ] && continue
        i=$((i+1))
        cat >> deploy-child.yml <<CHILD
      deploy_${i}_${host}:
        stage: deploy
        image: debian:trixie
        tags: [docker, unraid]
        needs:
          - pipeline: $CI_PIPELINE_ID
            job: build:image
        script:
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client
          - mkdir -p ~/.ssh && cp "\$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
          # GitLab File variables strip the trailing newline and OpenSSH
          # refuses a key without one, surfacing as a libcrypto error and
          # then permission denied.
          - printf '\n' >> ~/.ssh/id_ed25519
          - chmod 600 ~/.ssh/id_ed25519
          - ssh -o StrictHostKeyChecking=no root@${host} "docker pull \$CI_REGISTRY_IMAGE:\$CI_COMMIT_SHORT_SHA"
          - ssh -o StrictHostKeyChecking=no root@${host} "docker rm -f c-backupd || true"
          - ssh -o StrictHostKeyChecking=no root@${host} "docker run -d --name c-backupd --network ${network} --ip ${ip} -l net.unraid.docker.managed=dockerman --restart unless-stopped -v /mnt/user/appdata/c-backupd:/var/lib/c-backupd \$CI_REGISTRY_IMAGE:\$CI_COMMIT_SHORT_SHA"
      CHILD
      done
  artifacts:
    paths:
      - deploy-child.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CBACKUP_DEPLOY_TARGETS'

trigger_deploy:
  stage: deploy
  needs: [generate_deploy_child_pipeline]
  trigger:
    include:
      - artifact: deploy-child.yml
        job: generate_deploy_child_pipeline
    # depend so the parent pipeline reflects the children's status rather
    # than going green the moment the trigger is accepted.
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CBACKUP_DEPLOY_TARGETS'
