# c-backup pipeline.
#
# Stages short-circuit: nothing is built if the tests fail, and nothing is
# deployed if the build fails. Coverage is a ratchet rather than a fixed
# target, because a gate set to an aspiration gets overridden until it means
# nothing, while one set to the current floor catches real regressions.

# Merge requests run merge-request pipelines, which GitLab builds as merged
# results: the MR's changes merged onto the current target. Two MRs that are
# each green on their own branch once merged into a red 1.0.0 (FLAKE-14); a
# merged-results pipeline would have caught it. A branch with an open MR does
# not also get a branch pipeline, which would only duplicate the work. Every
# other branch push (1.0.0, v3, master, uat/*, branches without an MR) and
# every tag still gets a branch pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - analyze
  - coverage
  - build
  - deploy

# The FS1 proxy in front of git.airies.net answers 503 now and then. Absorb
# that inside the job (runner fetches, the c-utils clone, artifacts) rather
# than failing the pipeline and re-running all of it.
default:
  retry:
    max: 1
    when: [runner_system_failure, api_failure, stuck_or_timeout_failure]

variables:
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  CUTILS_DIR: /tmp/c-utils
  DEBIAN_FRONTEND: noninteractive
  # The Makefile defaults to the dev machine's znver3. Runners are not
  # guaranteed to be Zen 3, and a binary built for one CPU and run on another
  # dies on an illegal instruction, so CI builds to the portable floor.
  MARCH: x86-64-v2
  MTUNE: generic
  # Every suite's scratch, in the job's own directory so it goes when the
  # job does. The test, coverage and fuzz targets run each suite under
  # tests/scratch-guard.sh, which fails the suite that holds more than the
  # budget at once: jobs on one runner share its disk, and a single test
  # writing a sparse fixture out densely once filled it for all of them.
  C_BACKUP_TEST_DIR: $CI_PROJECT_DIR/build/test-scratch
  C_BACKUP_SCRATCH_BUDGET: 10G

.debian_deps: &debian_deps
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends
      build-essential git pkg-config ca-certificates
      libssl-dev liblz4-dev libacl1-dev libsqlite3-dev
      libmicrohttpd-dev libcurl4-openssl-dev libcmocka-dev
      libvirt-dev libxml2-dev qemu-utils
      sqlite3 curl gcovr cppcheck
      e2fsprogs

# c-utils is pinned by the cutils_version file rather than tracking its
# master, so a change over there cannot break this build without someone
# choosing to move the pin.
.fetch_cutils: &fetch_cutils
  - |
    for delay in 5 15 45 0; do
      rm -rf "$CUTILS_DIR"
      git clone -q https://git.airies.net/vifair22/c-utils.git "$CUTILS_DIR" && break
      [ "$delay" -eq 0 ] && { echo "c-utils clone failed after 4 tries"; exit 1; }
      echo "c-utils clone failed; retrying in ${delay}s"; sleep "$delay"
    done
  - git -C "$CUTILS_DIR" checkout -q "$(tr -d '[:space:]' < cutils_version)"
  - make -s -C "$CUTILS_DIR"

test:
  rules:
    # The gate job, and also the nightly schedule: ui-e2e there needs the
    # daemon this job builds.
    - when: on_success
  stage: test
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    - *fetch_cutils
  script:
    - make
    # A bare make must produce the programs: the Docker image build runs
    # exactly this, and once built nothing because the default goal slipped.
    - test -x build/bins/c-backupd && test -x build/bins/c-backup && test -x build/bins/c-backup-helper
    # Find somewhere the sparse fixtures can have real holes. Sourced, not
    # run: it exports the directory the suites read. Never fails the job -
    # if nothing here supports holes the suites skip, exactly as before.
    - mkdir -p "$C_BACKUP_TEST_DIR"
    - . tests/ci-sparse-fs.sh
    # Unit suites, then the two shell suites. The shell ones drive a real
    # daemon over HTTP and the CLI over its socket, which is the only way to
    # cover the routes, the auth middleware and the job manager.
    - make test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/bins/

analyze:
  rules:
    # Gate jobs: every MR and branch pipeline, never the nightly schedule.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  stage: analyze
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    - *fetch_cutils
  script:
    # 64 KiB per-function stack limit, gcc -fanalyzer, cppcheck. Worker
    # threads get 2-8 MiB stacks, so a function that quietly grows past the
    # limit is a crash waiting for a deep enough tree.
    - make analyze

# Fuzzing, on a budget a pipeline can afford.
#
# Two things happen here. The replay is the gate: it runs every input a
# fuzzer ever found interesting - including the reproducers for the three
# bugs that were found this way - and takes seconds. The short search is the
# opportunistic half: sixty seconds per target will not exhaust anything, but
# it is sixty seconds of a genuinely different test strategy on every push,
# and the corpus it grows comes back as an artifact to be committed.
#
# clang, because libFuzzer is an LLVM component. The strict-flag guarantees
# still come from the ordinary gcc build in the test stage; this exists to
# run the parsers against bytes nobody intended.
fuzz:
  rules:
    # Long jobs run nightly and on the image-cut pipelines, not on every MR:
    # the MR gate is build, tests, coverage and analyze.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH =~ /^uat\//
    - when: never
  stage: analyze
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    # clang alone is the driver with an empty resource directory: Debian
    # ships the sanitizer runtimes separately, so -fsanitize=fuzzer,address
    # fails at link with "cannot find libclang_rt.asan.a". Unversioned so
    # this does not pin the job to whichever clang trixie ships today.
    - apt-get install -y -qq --no-install-recommends clang libclang-rt-dev
    - *fetch_cutils
  script:
    # Without this fuzz_sparse_write returns at its first line, and spends
    # its whole budget doing so: 23 million no-op executions in the run that
    # measured it, against 63 a second when it has somewhere to work.
    - mkdir -p "$C_BACKUP_TEST_DIR"
    - . tests/ci-sparse-fs.sh
    # The gate. Any crash, timeout or sanitizer report on a known input fails
    # the pipeline.
    - make fuzz-regress
    # The search. A crash here fails the job too.
    - make fuzz-run FUZZ_TIME=60
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/fuzz/corpus/
      # Crash reproducers libFuzzer writes beside the binary.
      - crash-*
      - timeout-*
      - oom-*

# The desktop app's API contract.
#
# Its own job rather than a step inside `test`, because Debian trixie ships
# Node 20 and the suite needs 22.6 or newer for native type stripping. The
# `test` job skips it with a message; this is where it actually runs, which
# matters: a guard that quietly does not run is the failure it exists to
# prevent. It was skipped in CI for exactly one pipeline before this.
#
# No npm install. The suite uses only the standard library and the two
# TypeScript files it is testing, so there is nothing to fetch and nothing
# to keep in step with a lockfile.
ui:
  rules:
    # Gate jobs: every MR and branch pipeline, never the nightly schedule.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  stage: analyze
  # Trixie-based, deliberately. The daemon this suite starts is built in the
  # test job on debian:trixie, and a node image on an older Debian has an
  # older glibc - the binary will not load at all, which looks like every
  # test failing rather than like an image mismatch.
  image: node:24-trixie-slim
  tags: [docker]
  needs:
    - job: test
      artifacts: true
  before_script:
    # The suite starts a real c-backupd, so the image needs what the binary
    # links against. Runtime libraries only - nothing here compiles, the
    # daemon arrives built from the test job.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        libmicrohttpd12t64 liblz4-1 libssl3t64 libacl1 libsqlite3-0 libcurl4t64
  script:
    - node --version
    - ./build/bins/c-backupd --version || true
    - cd ui && npm test
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - ui/tests/

# The screen suites, against a real daemon and a real Electron window.
#
# Separate from `ui` above because the cost profile is completely different:
# that one needs nothing fetched, this one installs the dependency tree,
# downloads Electron, builds the renderer and runs a browser under Xvfb. It
# is also the suite that has found the most: every screen that rendered rows
# of blanks did so while the contract suite was green, because a request that
# reaches a real route can still be read with the wrong field names.
#
# It gates now. It ran allow_failure while it settled, which was the right
# call and also a trap: a green pipeline said nothing about whether these
# tests had run, and it hid a real failure on its first outing - the job died
# on a missing xauth without ever starting a test, and the pipeline reported
# success. Two clean runs later there is no reason to keep reading the job
# list by hand to find out whether the app works.
ui-e2e:
  rules:
    # Long jobs run nightly and on the image-cut pipelines, not on every MR:
    # the MR gate is build, tests, coverage and analyze.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH =~ /^uat\//
    - when: never
  stage: analyze
  image: node:24-trixie-slim
  tags: [docker]
  needs:
    - job: test
      artifacts: true
  before_script:
    - apt-get update -qq
    # What the daemon links against, plus what Electron needs to open a
    # window at all. Chromium's list is long and every one of them is a
    # hard requirement: a missing library shows up as the app failing to
    # start, which reads like the suite is broken.
    - apt-get install -y -qq --no-install-recommends
        libmicrohttpd12t64 liblz4-1 libssl3t64 libacl1 libsqlite3-0 libcurl4t64
        xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2
        libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
        libasound2t64 libpango-1.0-0 libcairo2 libgtk-3-0t64
  script:
    - cd ui
    - npm ci
    - npm run build
    # Electron refuses to run as root without this, and a CI container is
    # root. Sandboxing buys nothing here: the thing under test is the app.
    - export ELECTRON_DISABLE_SANDBOX=1
    - xvfb-run -a npx playwright test
  artifacts:
    when: always
    expire_in: 1 week
    # Per-case pass/fail in the MR's Tests tab. The config already emits
    # this file under CI and nothing was collecting it, so a failure would
    # have meant reading a job log to find out which screen broke.
    reports:
      junit: ui/test-results/e2e.xml
    paths:
      # The screenshots each spec takes on the way through. A layout is
      # easier to judge from a picture than from a passing assertion, and
      # these are the pictures a review looks at.
      - ui/test-results/

# Real-size pack rollover (B134): files of 300 MB, 600 MB and 2 GiB stored at
# the production seal. About 2.5 GiB of scratch, so it runs nightly rather
# than on every MR; make test covers the same logic at an 8 MiB test seal.
# The scratch directory is the job's own and is removed whatever happens.
nightly-rollover:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  stage: test
  image: debian:trixie
  tags: [docker]
  timeout: 90m
  before_script:
    - *debian_deps
    - *fetch_cutils
  script:
    - mkdir -p "$C_BACKUP_TEST_DIR"
    - make test-rollover-full
  after_script:
    - rm -rf "$C_BACKUP_TEST_DIR"

coverage:
  rules:
    # Gate jobs: every MR and branch pipeline, never the nightly schedule.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  stage: coverage
  image: debian:trixie
  tags: [docker]
  before_script:
    - *debian_deps
    - *fetch_cutils
  script:
    # Same as the test job: this one builds and runs its own binaries, so
    # without it the sparse suites skip here and the figure the gate reads
    # is missing everything they cover.
    - mkdir -p "$C_BACKUP_TEST_DIR"
    - . tests/ci-sparse-fs.sh
    - make coverage
  coverage: '/^lines:\s*(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/coverage/coverage.html

# Unit backup against real engines: Docker (a standalone container and a
# compose project, with hooks and a dump), LXC, and one libvirt VM offline
# and online, through the real helper and daemon, every restore compared
# byte for byte and every step checked for leftovers. The unit suites in
# `test` run the same code against stand-ins; this is what proves the
# stand-ins tell the truth.
#
# The runner is unprivileged, so the job starts ONE privileged sibling
# container through the bound socket, from the fixed image in
# ci/real-engines/ (built here, cached by content). The sibling runs only
# ci/real-engines/run.sh: its own dockerd (the runner's engine never sees a
# test container), a btrfs pool on a loop device, a private libvirtd with
# 1-vCPU cbk-uat-* domains, no network. ci/real-engines/job.sh reaps it three
# ways: stale labelled siblings at start, a trap on every exit, and the
# sibling's own timeout plus --rm when the job dies without its trap.
#
# ZFS is not here: the runner has no zfs module. It stays a scripted UAT
# step on FS1 (docs/helper.md, "UAT: real ZFS").
#
# Sized to leave the runner's other slots alone: one CPU and 2.5 GiB for the
# sibling, and one run at a time across all pipelines (resource_group).
# Only where it can find something: an MR touching the units code, its
# tests or this job's files, and the scheduled pipeline. Never a plain push.
real-engines:
  stage: analyze
  image: docker:cli
  tags: [docker]
  needs: []
  resource_group: cbackup-real-engines
  timeout: 50m
  variables:
    CBK_LIFETIME_S: "2700"
    CBK_REAP_AFTER_MIN: "55"
    CBK_SIBLING_CPUS: "1"
    CBK_SIBLING_MEMORY: "2560m"
  before_script:
    - apk add --no-cache -q bash git tar coreutils
  script:
    - ./ci/real-engines/job.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - src/providers/**/*
          - src/helper/**/*
          - src/virt/**/*
          - src/units/**/*
          - src/api/routes/units.c
          - src/api/routes/exports.c
          - src/common/privs.*
          - tests/test_units*
          - tests/test_providers.c
          - tests/test_helper*
          - tests/test_virt*
          - tests/test_docker.c
          - tests/test_lxc.c
          - tests/test_snap*
          - tests/test_mounts.c
          - tests/test_hooklog.c
          - tests/test_block_source.c
          - tests/test_nbd*
          - tests/test_privs.c
          - tests/fake_docker.h
          - tests/fake_host/**/*
          - tests/helper_fixture.h
          - tests/nbd_test_server.h
          - ci/real-engines/**/*

# The runner binds the host's Docker socket into the job, so builds and pushes
# run on the host daemon. The dind service this job used to declare was never
# reached: nothing set DOCKER_HOST to point at it.
build:image:
  stage: build
  image: docker:cli
  tags: [docker, unraid]
  script:
    # --provenance=false --sbom=false: a plain single manifest. Docker 29
    # attaches attestations by default, which makes the image an index, and
    # this registry rejects that push with "blob unknown" partway through,
    # naming a different blob each time. gitlab-infra's image job hit the same
    # thing and carries the same flags.
    - docker build --provenance=false --sbom=false -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # An image that builds but dies on startup is the failure this catches:
    # run it, wait, and confirm it is still up before pushing.
    - docker run -d --name smoke "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - docker ps --filter name=smoke --filter status=running | grep -q smoke
    - docker logs smoke
    - docker rm -f smoke
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - master

# Build the release image in a merge request whenever something it depends on
# changes, so a broken image is caught by the MR rather than at a UAT cut
# (BUILD-5: a bare make built nothing and only the image build noticed). It
# builds and smoke-runs the image like build:image, then deletes it; nothing
# is pushed.
build:image:check:
  stage: build
  needs: []
  image: docker:cli
  tags: [docker, unraid]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: [Makefile, Dockerfile, .dockerignore, cutils_version, .gitlab-ci.yml, packaging/**/*]
  variables:
    CHECK_TAG: cbackup-mrcheck:$CI_PIPELINE_ID
  script:
    - docker build --provenance=false --sbom=false -t "$CHECK_TAG" .
    - docker run -d --name "smoke-$CI_JOB_ID" "$CHECK_TAG"
    - sleep 5
    - docker ps --filter "name=smoke-$CI_JOB_ID" --filter status=running | grep -q "smoke-$CI_JOB_ID"
    - docker logs "smoke-$CI_JOB_ID"
  after_script:
    - docker rm -f "smoke-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker rmi "cbackup-mrcheck:$CI_PIPELINE_ID" >/dev/null 2>&1 || true

# Deploy fans out to one child job per target so a host can be added or
# removed by editing a CI variable rather than this file. With no targets set
# the generator would emit a child pipeline containing no jobs, which GitLab
# rejects, so the whole stage sits out until someone configures a target. A
# red pipeline because nobody has picked a deploy host yet is noise.
#
# The rule is a bare variable, not a `!= ""` comparison: an undefined variable
# compares as null, and null != "" is true, so the comparison form runs the
# job in exactly the case it was written to prevent. A bare variable matches
# only when it is both defined and non-empty.
generate_deploy_child_pipeline:
  stage: deploy
  image: debian:trixie
  tags: [docker]
  script:
    - |
      : > deploy-child.yml
      echo "stages: [deploy]" >> deploy-child.yml
      i=0
      # Belt and braces behind the rule above. A child pipeline with no jobs
      # fails downstream as "unknown_failure", which says nothing about the
      # cause; failing here names it.
      if [ -z "$(printf '%s' "$CBACKUP_DEPLOY_TARGETS" | tr -d '[:space:]')" ]; then
        echo "CBACKUP_DEPLOY_TARGETS is empty: nothing to deploy to" >&2
        exit 1
      fi
      printf '%s\n' "$CBACKUP_DEPLOY_TARGETS" | while IFS='|' read -r host network ip; do
        [ -z "$host" ] && continue
        i=$((i+1))
        cat >> deploy-child.yml <<CHILD
      deploy_${i}_${host}:
        stage: deploy
        image: debian:trixie
        tags: [docker, unraid]
        needs:
          - pipeline: $CI_PIPELINE_ID
            job: build:image
        script:
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client
          - mkdir -p ~/.ssh && cp "\$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
          # GitLab File variables strip the trailing newline and OpenSSH
          # refuses a key without one, surfacing as a libcrypto error and
          # then permission denied.
          - printf '\n' >> ~/.ssh/id_ed25519
          - chmod 600 ~/.ssh/id_ed25519
          - ssh -o StrictHostKeyChecking=no root@${host} "docker pull \$CI_REGISTRY_IMAGE:\$CI_COMMIT_SHORT_SHA"
          - ssh -o StrictHostKeyChecking=no root@${host} "docker rm -f c-backupd || true"
          - ssh -o StrictHostKeyChecking=no root@${host} "docker run -d --name c-backupd --network ${network} --ip ${ip} -l net.unraid.docker.managed=dockerman --restart unless-stopped -v /mnt/user/appdata/c-backupd:/var/lib/c-backupd \$CI_REGISTRY_IMAGE:\$CI_COMMIT_SHORT_SHA"
      CHILD
      done
  artifacts:
    paths:
      - deploy-child.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CBACKUP_DEPLOY_TARGETS'

trigger_deploy:
  stage: deploy
  needs: [generate_deploy_child_pipeline]
  trigger:
    include:
      - artifact: deploy-child.yml
        job: generate_deploy_child_pipeline
    # depend so the parent pipeline reflects the children's status rather
    # than going green the moment the trigger is accepted.
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CBACKUP_DEPLOY_TARGETS'
