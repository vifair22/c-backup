# c-backupd configuration.
#
# Read once at start; change it and restart the daemon. There is no API that
# changes configuration. Per-repository settings (retention, auto-pack) are
# separate: they are set with 'c-backup policy set'.
#
# The daemon finds this file at $C_BACKUP_CONFIG_PATH. The systemd unit and
# the container image both use /etc/c-backupd/config.yaml. Keep it 0600: it
# holds Pushover credentials. In a container, mounting your own copy over it
# read-only is fine.
#
# The daemon refuses to start on a line, key or value it cannot honour - an
# unknown or misspelt key, a number that is not one, a list or nested key -
# and names the file and line. The format is the simple one below: sections
# at the left margin, "key: value" lines indented under them.

db:
  # Under the systemd unit, StateDirectory= creates /var/lib/c-backupd; the
  # container image creates it and declares it a volume. Put it on fast
  # storage, never a parity-protected array (Manual 18.2).
  path: /var/lib/c-backupd/state.db

http:
  # The unix socket bypasses authentication entirely; it is created mode 0700,
  # so only the daemon's own user can connect. The daemon removes it on a
  # clean stop and replaces a stale one at start. Under systemd,
  # RuntimeDirectory= creates /run/c-backupd; the container image creates it.
  socket: /run/c-backupd/c-backupd.sock
  # TCP is for the desktop app on another machine. It requires a bearer token
  # or session cookie, and until the admin password is set (with
  # 'c-backup auth setup' on this host) it serves only the health probes.
  # Loopback by default: set bind to 0.0.0.0, or one interface's address, to
  # allow remote connections. The container image binds 0.0.0.0, because a
  # published port cannot reach a container's loopback; -p decides exposure.
  # The transport is plain HTTP, so put a reverse proxy or a tunnel in front
  # on any network you do not trust.
  port: 8765
  bind: 127.0.0.1

log:
  level: info

auth:
  # Requires HTTPS in front of the daemon; it does not terminate TLS itself.
  cookie_secure: 0

pushover:
  token: ""
  user: ""

scheduler:
  # 0 stops schedules firing; manual jobs still run.
  enabled: 1

jobs:
  # Jobs running at once across all repositories. Jobs for one repository
  # always run one at a time.
  max_parallel: 2

backup:
  # How a backup recognises a file it need not read again. auto compares
  # size, mtime, ctime, device and inode on local filesystems, and drops
  # device and inode on network and FUSE ones (NFS, SMB, Unraid shares),
  # where they are not stable. strict compares every field everywhere;
  # relaxed compares only size and mtime.
  file_cache_match: auto
  # Threads one backup stores large files (over 16 MiB) on at once. 0 picks
  # two thirds of the CPUs, fewer if memory is short; 1 stores them one
  # after another. A single file is hashed on one core either way.
  store_workers: 0

retention:
  # What a retention pass (c-backup gfs, or a gfs schedule) keeps for a
  # repository that has not set its own with 'c-backup policy set'. A
  # snapshot survives if it is among the newest keep_snaps, holds a tier
  # whose count it is within, or is tagged. 0 for a tier keeps all of it.
  # Retention does not run on its own: schedule it.
  keep_snaps: 1
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 12
  keep_yearly: 3
